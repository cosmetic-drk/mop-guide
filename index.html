<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Путеводитель МОП магазина ДРК</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#394fd9; --blue-dark:#2636a7; --blue-soft:#edf0ff; --berry:#e94f87; --berry-soft:#ffe8f0;
  --ink:#182340; --muted:#68718a; --line:#e3e7f2; --surface:#f7f8fc; --bg:#fff; --card:#fff;
  --green:#1e7c85; --green-soft:#e2f3f2; --amber:#9a6200; --amber-soft:#fff3d6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --blue:#8492ff; --blue-dark:#a5afff; --blue-soft:#232a52; --berry:#ff7aa8; --berry-soft:#3d2030;
    --ink:#eef0f8; --muted:#a3aac0; --line:#2c3350; --surface:#0f1324; --bg:#0d1020; --card:#171c33;
    --green:#6fd0d6; --green-soft:#183538; --amber:#f2c063; --amber-soft:#3a2f17;
  }
}
:root[data-theme="dark"]{
  --blue:#8492ff; --blue-dark:#a5afff; --blue-soft:#232a52; --berry:#ff7aa8; --berry-soft:#3d2030;
  --ink:#eef0f8; --muted:#a3aac0; --line:#2c3350; --surface:#0f1324; --bg:#0d1020; --card:#171c33;
  --green:#6fd0d6; --green-soft:#183538; --amber:#f2c063; --amber-soft:#3a2f17;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--surface);color:var(--ink);font:400 15px/1.5 Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.in{width:min(1080px,calc(100% - 40px));margin:0 auto}

header{background:var(--bg);border-bottom:1px solid var(--line)}
header .in{padding:28px 0 26px}
.kicker{color:var(--blue);font-size:13px;font-weight:600;letter-spacing:.06em}
h1{margin:8px 0 8px;font-size:clamp(26px,3.4vw,38px);line-height:1.1;letter-spacing:-.03em}
.lead{margin:0;color:var(--muted);max-width:640px}

.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.bar .in{padding:14px 0 12px}
.search{position:relative;display:block}
.search input{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 14px 0 42px;font-size:16px;outline:none}
.search input:focus{border-color:#9aa5ea;box-shadow:0 0 0 3px rgba(57,79,217,.12)}
.search svg{position:absolute;left:14px;top:14px;width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:1.8}
.chips{display:flex;gap:6px;overflow-x:auto;padding-top:10px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip small{color:var(--muted);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.chip[aria-pressed="true"] small{color:rgba(255,255,255,.8)}

main{padding:8px 0 64px}
section{margin-top:22px}
section h2{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:16px;letter-spacing:-.01em}
section h2 span{font-size:13px;color:var(--muted);font-weight:500}
.grid{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:10px 12px 10px 14px;border-top:1px solid var(--line);transition:background .12s}
.item:first-child{border-top:0}
.item:hover{background:var(--surface)}
.ico{flex:0 0 32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:10px;font-weight:700;letter-spacing:.02em}
.t-sheet{background:var(--green-soft);color:var(--green)}
.t-doc{background:var(--blue-soft);color:var(--blue)}
.t-folder{background:var(--amber-soft);color:var(--amber)}
.t-form{background:var(--berry-soft);color:#b23a68}
.t-site{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.body{flex:1;min-width:0}
.title{display:inline;font-weight:600;font-size:14px;line-height:1.3}
.title:hover{color:var(--blue);text-decoration:underline}
.desc{margin:1px 0 0;color:var(--muted);font-size:12.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:none}
.badge{font-size:11px;font-weight:500;color:var(--muted);margin-left:6px}
.creds{margin-top:6px;font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px 14px}
.creds div{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.creds code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.acts{display:flex;flex-direction:row;gap:4px;flex:0 0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;border:0;cursor:pointer;font-size:12.5px;font-weight:600;white-space:nowrap}
.btn-open{background:var(--blue);color:#fff}
.btn-open:hover{background:var(--blue-dark)}
.btn-copy{background:var(--blue-soft);color:var(--blue)}
.btn-mini{height:26px;padding:0 9px;font-size:12px;border-radius:7px;background:var(--blue-soft);color:var(--blue);border:0;cursor:pointer;font-weight:600}
.empty{text-align:center;color:var(--muted);padding:60px 0}
footer{color:var(--muted);font-size:13px;padding:0 0 40px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#182340;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.on{opacity:1}
@media (max-width:760px){
  .desc{white-space:normal}
  .acts .btn-copy{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.sales{margin-top:18px}
.sales-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.sales-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:12px}
.sales-head h2{margin:0;font-size:17px;letter-spacing:-.01em}
.sales-head span{color:var(--muted);font-size:13px}
.sales-head a{color:var(--blue);font-size:13px;font-weight:600;text-decoration:none}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border-radius:12px;padding:10px 12px}
.kpi small{display:block;color:var(--muted);font-size:12px}
.kpi b{display:block;font-size:20px;letter-spacing:-.02em;margin-top:2px}
.kpi.good b{color:#1e7c55}.kpi.warn b{color:#b23a3a}
.catrows{display:grid;gap:10px}
.catrow{display:grid;grid-template-columns:minmax(150px,1.2fr) 2.4fr minmax(110px,.9fr);gap:12px;align-items:center;font-size:13px}
.catrow .nm b{display:block;font-size:14px}.catrow .nm span{color:var(--muted);font-size:12px}
.prog{height:10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;border-radius:999px;background:var(--blue)}
.prog-l{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:4px}
.catrow .rest{text-align:right}.catrow .rest b{display:block;font-size:14px}.catrow .rest span{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.sup{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sup-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 220px;text-align:left;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.sup-row:first-child{border-top:0}
.sup-row.hd{background:var(--surface);font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.sup-row .n b{font-weight:600}.sup-row .br{color:var(--muted);font-size:12.5px}
.pay{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.p-kom{background:#edf0ff;color:#2636a7}.p-sale{background:#e2f3ea;color:#1e7c55}.p-inv{background:#fff3d6;color:#8a5a00}.p-pre{background:#ffe8f0;color:#a33862}.p-cash{background:#f1efe8;color:#5f5e5a}.p-upd{background:#e1f5ee;color:#0f6e56}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.catrow{grid-template-columns:1fr}.catrow .rest{text-align:left}.sup-row{grid-template-columns:1fr}.sup-row.hd{display:none}}
</style>
</head>
<body>
<header>
  <div class="in">
    <div class="kicker">МАГАЗИН ИНСТИТУТА ДРК</div>
    <h1>Путеводитель менеджера магазина</h1>
    <p class="lead">Все рабочие ссылки в одном месте: графики, скрипты, партнёры, клиенты и обучение. Найдите нужное через поиск или по разделам.</p>
  </div>
</header>
<section class="in sales" aria-label="Продажи магазина"><div class="sales-card" id="sales"></div></section>

<div class="bar">
  <div class="in">
    <div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="links" aria-selected="true">Ссылки</button><button class="tab" role="tab" data-tab="sup" aria-selected="false">Поставщики и тип расчёта</button></div>
    <label class="search"><span style="position:absolute;left:-9999px">Поиск</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>

  </div>
</div>

<main class="in" id="list"></main>
<footer class="in">Источник: таблица «Путеводитель МОП магазина». Чтобы добавить ссылку, напишите, какую и в какой раздел.</footer>
<div class="toast" id="toast" role="status"></div>

<script>

const TYPE = { sheet: ['Таблица', 'XLS', 't-sheet'], doc: ['Документ', 'DOC', 't-doc'], folder: ['Папка', 'DIR', 't-folder'], form: ['Форма', 'FORM', 't-form'], site: ['Сайт', 'WEB', 't-site'] };
const LINKS = [

  { s: 'daily', t: 'site', name: 'Страница брендов для внутреннего пользования и рассылок', desc: 'Лендинг с брендами, каталогом, протоколами и 100% кешбэком. Ссылку можно отправлять клиентам.', url: 'https://cosmeticdrk.github.io/shop-brands/' },

  { s: 'schedule', t: 'sheet', name: 'Аналитика и отчёты магазина', desc: 'План продаж по трём категориям брендов, сводные отчёты за недели, итоги месяцев, выручка по брендам и менеджерам, модель мотивации.', url: 'https://docs.google.com/spreadsheets/d/1PSIsbwA6X3WthI5kqqPNSvK6h_6TGlStsL_RtggLekw/edit' },

function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
const toNum = s => { const v = parseFloat(String(s || '').replace(/[~\s\u00a0₽руб.%]/g, '').replace(',', '.')); return isFinite(v) ? v : 0; };
async function loadSales() {

    const res = await fetch(SALES_CSV, { cache: 'no-store', signal: ctrl.signal }); clearTimeout(tm);
    if (!res.ok) throw new Error(res.status);
    const text = await res.text(); const rows = parseCSV(text);
    const pick = name => rows.find(r => (r[0] || '').trim().toLowerCase() === name);
    const mk = r => [r[0].trim(), (r[1] || '').trim(), toNum(r[2]), toNum(r[3]), toNum(r[4]), toNum(r[5]), toNum(r[9])];
    const cats = ['1 категория', '2 категория', '3 категория'].map(pick);
    const tot = pick('итого');
    if (cats.some(x => !x) || !tot) throw new Error('format');
    const s = { ...SALES, rows: cats.map(mk), total: mk(tot), live: true };
    const hdr = rows.find(r => (r[0] || '').trim() === 'Категория');
    if (hdr && hdr[10]) { const m = hdr[10].match(/\(([^)]+)\)/); const d = hdr[10].match(/(\d+)\s*дн/); if (m) s.left = m[1] + (d ? ` (${d[1]} дн.)` : ''); }
    const dm = text.match(/по файлу на (\d{1,2}\.\d{1,2})/); if (dm) s.period = 'по данным на ' + dm[1];
    const mm = text.match(/плана на ([а-яё]+)/i); if (mm) s.month = mm[1].toLowerCase();
    s.stamp = new Date().toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    Object.assign(SALES, s); renderSales();
  } catch (e) { SALES.live = false; renderSales(); }
}

function render() {

async function copy(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {
    try { const a = document.createElement('textarea'); a.value = t; a.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(a); a.select(); const ok = document.execCommand('copy'); a.remove(); return ok; } catch (e2) { return false; } }
}
